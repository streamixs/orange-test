apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: add-labels

spec:
  evaluation:
    mutateExisting:
      enabled: true
  # Trigger après scheduling : le kubelet met à jour pods/status une fois le Pod placé.
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods/status"]
        operations: ["UPDATE"]
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: online-boutique
  # Cible : les Pods. object = le Pod cible, donc spec.nodeName est rempli.
  targetMatchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        operations: ["CREATE", "UPDATE"]
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: online-boutique
  # Ne cible que les Pods déjà schedulés (spec.nodeName présent).
  targetMatchConditions:
    - name: scheduled
      expression: has(object.spec.nodeName)
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >
          Object{
            metadata: Object.metadata{
              labels: Object.metadata.labels{
                `app.kubernetes.io/managed-by`: "Kyverno",
                `namespace-name`: object.metadata.namespace,
                `node-name`: object.spec.nodeName
              }
            }
          }
