apiVersion: policies.kyverno.io/v1
Kind: MutationPolicy
metadata:
  name: add-labels

spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        operations: [CREATE]
  targetMatchConstraints:


  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >
          Object{
            metadata: {
              labels: {
                "app.kubernetes.io/managed-by": "Kyverno"
                "namespace-name": "request.object.metadata.namespace
                "node-name": "request.object.spec.nodeName"
              }
            }
          }
